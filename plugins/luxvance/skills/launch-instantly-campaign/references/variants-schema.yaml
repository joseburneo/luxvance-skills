# variants.yaml — schema reference only. No example copy.
# build-campaign emits this file. launch-instantly-campaign consumes it.
#
# Instantly syntax (NOT Smartlead syntax):
#   Spintax:      {{RANDOM|option1|option2|option3}}    (double braces, RANDOM keyword required)
#   Merge field:  {{firstName}}, {{companyName}}, {{Variable 1}}, {{situation_line}}
#
# Both pass through to Instantly unmodified. Do not escape, encode, or normalize.
# Standard Luxvance merge fields use camelCase ({{firstName}}, {{companyName}}, {{accountSignature}})
# or spaced names ({{Variable 1}}, {{Variable 2}}). New AI-generated fields use snake_case
# ({{situation_line}}, {{value_line}}, {{cta_line}}). The deployer translates from CSV column names
# (always snake_case) to Instantly field names on upload; see leads-csv-schema.md.

# Campaign name shown in Instantly UI. Follow the Luxvance naming convention:
# `Luxvance - <Region> - <Persona> - <Trigger> - W<ISO week>`
name: "REQUIRED"

# Sending schedule. Maps to Instantly's campaign schedule object.
schedule:
  timezone: America/New_York         # IANA timezone. Match the prospect region.
  days: [1, 2, 3, 4, 5]               # 1=Mon ... 7=Sun. Default M-F.
  start_hour: "08:00"                 # HH:MM 24-hour local to the timezone
  end_hour: "17:00"
  min_time_btw_emails: 10             # minutes between consecutive sends from the same inbox
  max_leads_per_day: 30               # new leads started per inbox per day. 30 is the Luxvance default for warmed inboxes.

# Which sending accounts to attach. Inboxes must be tagged in Instantly first.
inbox_selection:
  tag: active                          # the Instantly tag to filter by. Must exist.
  count: 20                            # how many accounts to attach. LRU by daily sent count.

# Sequence steps. Each step has 1-3 variants for A/B/C testing.
sequences:
  - step: 1                            # REQUIRED, sequential integers starting at 1
    delay_days: 0                      # days after previous step. Step 1 is always 0.
    variants:
      - label: A                       # REQUIRED, one of A, B, C
        subject: ""                    # subject line with optional spintax
        body: ""                       # full body with {{merge_fields}} and {spintax}
      - label: B
        subject: ""
        body: ""
      - label: C
        subject: ""
        body: ""

  # Optional follow-up steps. Default for Luxvance is Step 1 only. Add steps only when
  # Jose explicitly asks for the full sequence.
  - step: 2
    delay_days: 3                      # threaded follow-up. Use empty subject to thread.
    variants:
      - label: A
        subject: ""                    # empty string = thread under Step 1
        body: ""

  - step: 3
    delay_days: 4
    variants:
      - label: A
        subject: ""                    # new thread. Use a fresh subject.
        body: ""
